{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="auth-form">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Login</button>
    </form>
    <p>Forgot password? <a href="#">Reset it</a></p>
</div>
{% endblock %}
